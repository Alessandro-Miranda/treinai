<ion-content color="dark" class="ion-padding" [fullscreen]="true">
  <ion-grid class="ion-no-padding">
    <ion-row class="ion-align-items-center ion-justify-content-between">
      <ion-col size="2">
        <img src="../../../assets/images/logo_sm.png" alt="Logo Treinaí" class="header__image" />
      </ion-col>
      <ion-col size="2">
        <img src="https://placehold.net/avatar.png" alt="user picture" class="header__image" />
      </ion-col>
    </ion-row>
  </ion-grid>

  <div class="workouts__welcome-container">
    <span>
      Olá, Usuário!
    </span>
    <h1>
      Treinos
    </h1>
    <p>
      Seu foco de hoje constrói seus resultados de amanhã.
    </p>
  </div>

  <app-empty-state />

  <ion-fab slot="fixed" vertical="bottom" horizontal="end">
    <ion-fab-button>
      <ion-icon name="add"></ion-icon>
    </ion-fab-button>
  </ion-fab>
</ion-content>
