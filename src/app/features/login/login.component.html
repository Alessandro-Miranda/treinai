<ion-content [fullscreen]="true" class="ion-padding" color="dark">
  <img src="../../../assets/images/LogoSplash.png" loading="lazy" class="login__logo" />

  <div class="login__header">
    <span class="login__header-welcome">bem-vindo de volta</span>

    <h1 class="login__header-title">Faça login para <span>continuar</span></h1>

    <p class="login__header-description">
      Acesse sua conta e continue evoluindo em direção ao seus objetivos.
    </p>
  </div>

  <form>
    <ion-grid>
      <ion-row class="login__input-container">
        <span class="login__input-label">e-mail</span>
        <ion-input
          type="email"
          placeholder="seu@email.com"
          aria-label="e-mail"
          fill="outline"
          class="login__input"
        >
          <ion-icon slot="start" name="mail-outline" aria-hidden="true"></ion-icon>
        </ion-input>
      </ion-row>

      <ion-row class="login__input-container">
        <span class="login__input-label">senha</span>
        <ion-input
          type="password"
          placeholder="********"
          aria-label="senha"
          fill="outline"
          [required]="true"
          class="login__input"
        >
          <ion-input-password-toggle slot="end" />
          <ion-icon slot="start" name="lock-closed-outline" aria-hidden="true"></ion-icon>
        </ion-input>
        <a class="login__forgot-password">Esqueci minha senha</a>
      </ion-row>

      <ion-row>
        <ion-col size="12">
          <ion-button expand="block" class="login__submit" (click)="navigateToHome()">
            Entrar
            <ion-icon name="arrow-forward-outline" slot="end" class="ion-margin-start"></ion-icon>
          </ion-button>
        </ion-col>
      </ion-row>
    </ion-grid>

    <ion-grid class="login__social">
      <ion-row class="ion-justify-content-center ion-align-items-center">
        <ion-col size="5" class="ion-no-padding">
          <hr />
        </ion-col>
        <ion-col size="2" class="ion-no-padding">
          <span> ou </span>
        </ion-col>
        <ion-col size="5" class="ion-no-padding">
          <hr />
        </ion-col>
      </ion-row>

      <ion-row class="login__social__button-container">
        <ion-col size="12">
          <ion-button
            expand="block"
            fill="outline"
            class="login__social-button"
            (click)="navigateToHome()"
          >
            <ion-icon
              slot="start"
              name="logo-google"
              class="ion-margin-end"
              aria-hidden="true"
            ></ion-icon>
            Entrar com Google
          </ion-button>
        </ion-col>
      </ion-row>
    </ion-grid>

    <p class="ion-text-center login__create-account">
      Ainda não tem uma conta? <a>Criar conta</a>
    </p>
  </form>
</ion-content>
